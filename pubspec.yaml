name: arabic_ocr
description: Arabic-first hybrid OCR scanner for Android
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  flutter_tesseract_ocr: ^0.4.28
  pdfx: ^2.8.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^10.1.4
  archive: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata/
