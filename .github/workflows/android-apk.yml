name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        run: flutter create --platforms=android --org com.madani.ocr --project-name arabic_ocr .
      - name: Download OCR language data
        run: |
          mkdir -p assets/tessdata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_best/raw/main/ara.traineddata -o assets/tessdata/ara.traineddata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_best/raw/main/eng.traineddata -o assets/tessdata/eng.traineddata
      - name: Configure Android permissions and minimum SDK
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle || true
      - name: Resolve packages
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: arabic-ocr-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
